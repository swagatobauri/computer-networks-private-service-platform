worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    access_log logs/access.log;
    error_log logs/error.log;

    upstream backend_pool {
        # Backend A - Mac 2
        server 127.0.0.1:3001;

        # Backend B - Mac 3
        # Replace with the confirmed Mac 3 IP if it changes.
        server 10.7.9.59:3002;
    }

    server {
        listen 80;
        server_name app.team1.test api.team1.test;

        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name app.team1.test api.team1.test;

        # TLS files are intentionally NOT stored in GitHub.
        # Configure these paths on the Mac 2 machine.
        ssl_certificate /opt/homebrew/etc/nginx/certs/server.crt;
        ssl_certificate_key /opt/homebrew/etc/nginx/certs/server.key;

        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://backend_pool;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_connect_timeout 3s;
            proxy_read_timeout 10s;

            proxy_next_upstream error timeout http_502 http_503 http_504;

            add_header X-Edge "Mac2-Nginx" always;
        }
    }
}
